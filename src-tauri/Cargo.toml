[package]
name = "fastnote"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fastnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标必须在 Rust 侧编译进来，否则前端的 tray 命令运行时不存在
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# 真正的跨进程单实例：命名互斥量实现，第二实例会回调并退出自己
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
# 数据目录兜底：Builder 之前要读单例开关，那时还没有 AppHandle 拿不到 tauri 的路径解析，
# 用 dirs 自己算（规则与 tauri 的 app_data_dir 一致：data_dir()/identifier）
dirs = "6"
# 分组导出：ZIP 打包 / EPUB（本质是特定结构的 zip）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 分组导出：笔记正文是 Markdown，导出 HTML / EPUB 时渲染成网页
pulldown-cmark = "0.12"
chrono = { version = "0.4", features = ["serde"] }
# API Key 加密存储：AES-256-GCM + SHA-256 派生（版本与锁文件一致，可离线构建）
ring = "0.17"
sha2 = "0.10"
